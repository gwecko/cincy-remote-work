<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Places to Remote Work</title>
<meta name="description" content="Cincinnati remote-work spots, auto-sorted by what's open right now. No controls.">
<style>
  :root{
    --bg:#faf7f2; --panel:#fff; --line:#e6ded2; --ink:#241f1a; --muted:#7a6f62;
    --accent:#b4531f; --open:#2f7a44; --openbg:#e6f2e9; --shut:#8a8178; --shutbg:#f0ece6;

    /* Type scale — modeled on the iOS/iPadOS Dynamic Type text styles (size/leading
       ratio kept close to Apple's published "Large" table), in rem so it rides the
       reader's own browser/OS text-size setting instead of a fixed pixel size. */
    --fs-large-title:2.125rem;  --lh-large-title:1.21;
    --fs-title3:1.25rem;        --lh-title3:1.25;
    --fs-headline:1.0625rem;    --lh-headline:1.29;
    --fs-body:1rem;             --lh-body:1.3;
    --fs-subheadline:0.9375rem; --lh-subheadline:1.33;
    --fs-footnote:0.8125rem;    --lh-footnote:1.38;
    --fs-caption:0.75rem;       --lh-caption:1.33;

    --w-regular:400; --w-medium:500; --w-semibold:600; --w-bold:700;

    /* Base side margin; safe-area insets are added on top of this, not instead of it. */
    --side-margin:20px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140f; --panel:#201c16; --line:#332c23; --ink:#f2ece2; --muted:#a2988a;
      --accent:#e3854a; --open:#7fd39a; --openbg:#1d2f23; --shut:#867c70; --shutbg:#262019;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140f; --panel:#201c16; --line:#332c23; --ink:#f2ece2; --muted:#a2988a;
    --accent:#e3854a; --open:#7fd39a; --openbg:#1d2f23; --shut:#867c70; --shutbg:#262019;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:var(--fs-body); line-height:var(--lh-body);
  }

  /* Mobile-first: this is the base layout, written for a 390pt-wide phone.
     The min-width query further down is the adaptation, not the design. */
  .wrap{
    max-width:40rem; margin:0 auto;
    padding-top:calc(env(safe-area-inset-top, 0px) + 28px);
    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 56px);
    padding-left:calc(env(safe-area-inset-left, 0px) + var(--side-margin));
    padding-right:calc(env(safe-area-inset-right, 0px) + var(--side-margin));
  }

  header{margin-bottom:4px}
  h1{
    font-size:var(--fs-large-title); line-height:var(--lh-large-title);
    font-weight:var(--w-bold); letter-spacing:-.015em; margin:0 0 6px;
  }
  .status{
    font-size:var(--fs-subheadline); line-height:var(--lh-subheadline);
    color:var(--muted); margin:0 0 8px;
  }

  h2.tier{
    font-size:var(--fs-footnote); line-height:var(--lh-footnote);
    font-weight:var(--w-bold); letter-spacing:.06em; text-transform:uppercase;
    margin:0 0 12px; padding-top:28px; border-top:1px solid var(--line);
  }
  section:first-of-type h2.tier{border-top:none; padding-top:22px}
  h2.tier.open-h{color:var(--open)}
  h2.tier.later-h{color:var(--accent)}
  h2.tier.closed-h{color:var(--shut)}

  ul.cards{list-style:none; margin:0; padding:0; display:grid; gap:12px}
  ul.cards > li{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px 18px;
  }

  .top{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px}
  .name{
    font-size:var(--fs-headline); line-height:var(--lh-headline);
    font-weight:var(--w-semibold); margin:0;
  }
  .note{
    font-size:var(--fs-footnote); line-height:var(--lh-footnote);
    font-weight:var(--w-medium); color:var(--accent);
  }
  .hood{
    display:block; font-size:var(--fs-subheadline); line-height:var(--lh-subheadline);
    color:var(--accent); margin:2px 0 0;
  }
  .atmo{
    font-size:var(--fs-body); line-height:var(--lh-body);
    color:var(--ink); margin:8px 0 0;
  }
  .addr{margin:6px 0 0}
  .addr a{
    display:inline-block; color:var(--muted); text-decoration:underline;
    text-underline-offset:2px; font-size:var(--fs-footnote); line-height:var(--lh-footnote);
    /* Invisible touch-target expansion: padding grows the tap area to 44pt tall
       without shifting surrounding layout (offsetting margin cancels it visually). */
    padding:14px 6px; margin:-14px -6px;
  }

  ul.hours{
    list-style:none; margin:14px 0 0; padding:12px 0 0; border-top:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:7px 16px;
    font-size:var(--fs-caption); line-height:var(--lh-caption); color:var(--muted);
  }
  ul.hours li{white-space:nowrap}
  ul.hours .dow{font-weight:var(--w-semibold)}
  ul.hours li.today{
    color:var(--ink); font-weight:var(--w-semibold);
    text-decoration:underline; text-underline-offset:3px;
  }

  ul.closed-list{list-style:none; margin:0; padding:0; display:grid; gap:10px}
  ul.closed-list li{
    font-size:var(--fs-footnote); line-height:var(--lh-footnote); color:var(--muted);
  }
  ul.closed-list .cname{color:var(--ink); font-weight:var(--w-medium)}
  ul.closed-list .chood{color:var(--accent)}

  .footnote{
    margin-top:32px; padding-top:18px; border-top:1px solid var(--line);
    font-size:var(--fs-footnote); line-height:var(--lh-footnote); color:var(--muted);
  }
  .footnote strong{color:var(--ink); font-weight:var(--w-semibold)}

  /* Laptop is the adaptation: roomier margins and a touch more breathing room,
     not a different structure and not a multi-column card grid — a single
     comfortably-measured reading column stays correct at any width. */
  @media (min-width:700px){
    :root{--side-margin:32px}
    .wrap{padding-top:calc(env(safe-area-inset-top, 0px) + 48px)}
    ul.cards > li{padding:20px 24px 22px}
  }
</style>
</head>

<script>
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// "6:30a", "7p" -> minutes past midnight
function toMinutes(t){
  const m = /^(\d{1,2})(?::(\d{2}))?([ap])$/.exec(t.trim());
  if(!m) return null;
  let h = parseInt(m[1],10) % 12;
  if(m[3] === "p") h += 12;
  return h*60 + (m[2] ? parseInt(m[2],10) : 0);
}

// "7a–9p" -> {a,b,spans}; null if not a plain two-time range (e.g. "Closed", "N/A", "2nd Sat only")
function parseRange(text){
  const parts = text.split(/[–-]/);
  if(parts.length !== 2) return null;
  const a = toMinutes(parts[0]), b = toMinutes(parts[1]);
  if(a === null || b === null) return null;
  return { a, b, spans: b < a }; // spans === past midnight
}

// Cincinnati "now", hardcoded to America/New_York regardless of the viewer's own clock/timezone
function nowInCincinnati(){
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", weekday: "short",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23"
  });
  const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
  const idx = DAYS.indexOf(parts.weekday);
  const min = parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
  return { idx, min };
}

function fmtClock(min){
  min = ((min % 1440) + 1440) % 1440;
  let h = Math.floor(min/60), m = min%60;
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12; if(h === 0) h = 12;
  return `${h}:${String(m).padStart(2,"0")}${ap}`;
}

function fmtDur(min){
  const h = Math.floor(min/60), m = min%60;
  if(h === 0) return `${m} min`;
  if(m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

// Classify one place against "now": open (with remaining minutes), later-today (with wait),
// or closed-today (with the next day/time it opens, searched forward up to 6 days).
function classify(place, idx, min){
  const today = parseRange(place.hours[idx]);
  const yestIdx = (idx + 6) % 7;
  const yest = parseRange(place.hours[yestIdx]);

  // still open from last night's overnight window spilling into this morning
  if(yest && yest.spans && min < yest.b){
    return { status: "open", remaining: yest.b - min };
  }
  if(today){
    if(!today.spans && min >= today.a && min < today.b){
      return { status: "open", remaining: today.b - min };
    }
    if(today.spans && min >= today.a){
      return { status: "open", remaining: (1440 - min) + today.b };
    }
    if(min < today.a){
      return { status: "later", wait: today.a - min, at: today.a };
    }
  }
  for(let d = 1; d <= 6; d++){
    const j = (idx + d) % 7;
    const r = parseRange(place.hours[j]);
    if(r){ return { status: "closed", nextDay: DAYS[j], nextAt: r.a }; }
  }
  return { status: "closed", nextDay: null, nextAt: null };
}

const NOW = nowInCincinnati();

const porch = DATA.find(p => p.hours.every(h => h === "N/A"));
const real = DATA.filter(p => p !== porch);

const openNow = [], later = [], closed = [];
for(const p of real){
  const c = classify(p, NOW.idx, NOW.min);
  if(c.status === "open") openNow.push({ p, ...c });
  else if(c.status === "later") later.push({ p, ...c });
  else closed.push({ p, ...c });
}
openNow.sort((a,b) => b.remaining - a.remaining);   // most runway first
later.sort((a,b) => a.wait - b.wait);               // soonest opening first
closed.sort((a,b) => a.p.place.localeCompare(b.p.place));

document.getElementById("status").textContent =
  `${openNow.length} open right now · ${DAYS[NOW.idx]} ${fmtClock(NOW.min)}`;

function hoursList(p){
  return p.hours.map((t,i) =>
    `<li class="${i===NOW.idx ? "today" : ""}"><span class="dow">${DAYS[i]}</span> ${t}</li>`).join("");
}

// Apple Maps opens the app on iPhone and Mac, the web map elsewhere.
// Addresses that already name a city (Covington, Newport) are across the river.
function mapQuery(p){
  const city = p.address.includes(",") ? " KY" : ", Cincinnati OH";
  return p.place + ", " + p.address + city;
}

function card(entry, note){
  const p = entry.p;
  return `<li>
    <div class="top">
      <h3 class="name">${p.place}</h3>
      ${note ? `<span class="note">${note}</span>` : ""}
    </div>
    <span class="hood">${p.neighborhood}</span>
    <p class="atmo">${p.atmosphere}</p>
    <p class="addr"><a href="https://maps.apple.com/?q=${encodeURIComponent(mapQuery(p))}" target="_blank" rel="noopener">${p.address}</a></p>
    <ul class="hours">${hoursList(p)}</ul>
  </li>`;
}

let html = "";

if(openNow.length){
  html += `<section><h2 class="tier open-h">Open now</h2><ul class="cards">`;
  html += openNow.map(e => card(e, e.remaining < 60 ? `closes in ${fmtDur(e.remaining)}` : "")).join("");
  html += `</ul></section>`;
}

if(later.length){
  html += `<section><h2 class="tier later-h">Opening later today</h2><ul class="cards">`;
  html += later.map(e => card(e, `opens in ${fmtDur(e.wait)} · ${fmtClock(e.at)}`)).join("");
  html += `</ul></section>`;
}

if(closed.length){
  html += `<section><h2 class="tier closed-h">Closed today</h2><ul class="closed-list">`;
  html += closed.map(e => {
    const next = e.nextDay ? `opens ${e.nextDay} ${fmtClock(e.nextAt)}` : "hours unclear";
    return `<li><span class="cname">${e.p.place}</span> — <span class="chood">${e.p.neighborhood}</span> — ${next}</li>`;
  }).join("");
  html += `</ul></section>`;
}

document.getElementById("content").innerHTML = html;

}
