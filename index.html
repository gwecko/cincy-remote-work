    text-transform:uppercase; padding:3px 8px; border-radius:20px; white-space:nowrap;

  .badge.shut{color:var(--shut); background:var(--shutbg)}
  .hood{color:var(--accent); font-size:.9rem}
  .atmo{margin:6px 0 0; color:var(--ink)}
  .addr{margin:4px 0 0; font-size:.9rem}
  .addr a{color:var(--muted)}
  .hours{
    margin:12px 0 0; padding:0; display:grid; grid-template-columns:repeat(7,1fr); gap:4px;

  .hours div{border:1px solid var(--line); border-radius:6px; padding:5px 2px; color:var(--muted)}
  .hours div.today{border-color:var(--accent); color:var(--ink)}
  .hours dt{font-weight:600; letter-spacing:.03em}
  .hours dd{margin:2px 0 0}
  .empty{color:var(--muted); padding:30px 0}
  footer{margin-top:40px; color:var(--muted); font-size:.85rem}
  @media (max-width:560px){

    h1{font-size:1.6rem}
    .hours{grid-template-columns:repeat(4,1fr)}

  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="Search a place, a vibe, a street" aria-label="Search">
    <select id="hood" aria-label="Neighborhood"><option value="">All neighborhoods</option></select>
    <label class="toggle"><input type="checkbox" id="now"> Open now</label>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>

  <footer>Hours change. Call ahead before you drive.</footer>

<script>
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

// "6:30a", "7p" -> minutes past midnight
function toMinutes(t){
  const m = /^(\d{1,2})(?::(\d{2}))?([ap])$/.exec(t.trim());
  if(!m) return null;
  let h = parseInt(m[1],10) % 12;
  if(m[3] === "p") h += 12;
  return h*60 + (m[2] ? parseInt(m[2],10) : 0);
}

// Is `text` ("7a–9p", "Closed", "3p–2:30a") open at `min` minutes on that day?
function openAt(text, min){
  const parts = text.split(/[–-]/);
  if(parts.length !== 2) return false;
  const a = toMinutes(parts[0]), b = toMinutes(parts[1]);
  if(a === null || b === null) return false;
  return b > a ? (min >= a && min < b) : (min >= a || min < b); // b < a means past midnight
}

function isOpenNow(place){
  const d = new Date();
  const idx = (d.getDay() + 6) % 7;            // JS Sunday=0 -> our Monday=0
  const min = d.getHours()*60 + d.getMinutes();
  if(openAt(place.hours[idx], min)) return true;
  const prev = (idx + 6) % 7;                   // spillover from last night
  const p = place.hours[prev].split(/[–-]/);
  if(p.length === 2){
    const a = toMinutes(p[0]), b = toMinutes(p[1]);
    if(a !== null && b !== null && b < a && min < b) return true;
  }
  return false;
}

let places = [];
const list = document.getElementById("list");
const count = document.getElementById("count");
const q = document.getElementById("q");
const hood = document.getElementById("hood");
const now = document.getElementById("now");
const todayIdx = (new Date().getDay() + 6) % 7;

function render(){
  const term = q.value.trim().toLowerCase();
  const h = hood.value;
  const onlyOpen = now.checked;

  const shown = places.filter(p => {
    if(h && p.neighborhood !== h) return false;
    if(onlyOpen && !isOpenNow(p)) return false;
    if(!term) return true;
    return [p.place, p.atmosphere, p.neighborhood, p.address].join(" ").toLowerCase().includes(term);
  });

  count.textContent = shown.length + (shown.length === 1 ? " place" : " places");
  list.innerHTML = "";

  if(!shown.length){
    list.innerHTML = '<li class="empty">Nothing matches. Try fewer words.</li>';
    return;
  }

  for(const p of shown){
    const open = isOpenNow(p);
    const li = document.createElement("li");
    const days = p.hours.map((t,i) =>
      `<div class="${i===todayIdx ? "today" : ""}"><dt>${DAYS[i]}</dt><dd>${t}</dd></div>`).join("");
    li.innerHTML = `
      <div class="top">
        <h2 class="name">${p.place}</h2>
        <span class="badge ${open ? "open" : "shut"}">${open ? "Open now" : "Closed now"}</span>
        <span class="hood">${p.neighborhood}</span>
      </div>
      <p class="atmo">${p.atmosphere}</p>
      <p class="addr"><a href="https://maps.google.com/?q=${encodeURIComponent(p.address + ", Cincinnati OH")}" target="_blank" rel="noopener">${p.address}</a></p>
      <dl class="hours">${days}</dl>`;
    list.appendChild(li);
  }
}
